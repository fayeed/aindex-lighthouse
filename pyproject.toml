[build-system]
requires = ["setuptools>=65", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "aindex-lighthouse"
version = "0.1.0"
description = "AI Lighthouse — local-first AI-readiness audit engine (Phase 1)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name="Fayeed Pawaskar", email="fayeed@live.com" }]
keywords = ["ai", "seo", "audit", "json-ld", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "diskcache>=5.6.3",
    "extruct>=0.18.0",
    "httpx>=0.28.1",
    "jsonschema>=4.25.1",
    "pluggy>=1.6.0",
    "pydantic>=2.12.4",
    "pyld>=2.0.4",
    "rdflib>=7.4.0",
    "rich>=14.2.0",
    "tldextract>=5.3.0",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "black>=25.11.0",
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "pre-commit>=4.4.0",
    "ruff>=0.14.4",
]

[project.scripts]
ai-lighthouse = "ai_lighthouse.cli:app"